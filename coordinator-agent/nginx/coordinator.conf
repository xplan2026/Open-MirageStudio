# Coordinator-Agent Nginx 配置
# 部署路径: /opt/mirage-studio/coordinator-agent/nginx/coordinator.conf
# 使用方式: ln -s /opt/mirage-studio/coordinator-agent/nginx/coordinator.conf /etc/nginx/sites-enabled/coordinator

server {
    listen 80;
    server_name a-o-c.cc.cd;  # 工作台管理域名 (DNS-only 灰云, 绕过腾讯云备案拦截)

    # SSL (Phase 5)
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/admin.mirage-studio.cn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/admin.mirage-studio.cn/privkey.pem;

    # ==================== Admin UI (静态文件) ====================
    location / {
        root /opt/mirage-studio/coordinator-agent/admin-ui/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ==================== 认证路由 (QR 码扫码登录) ====================
    location /auth/ {
        proxy_pass http://127.0.0.1:3100/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==================== Admin API 反向代理 ====================
    location /admin/ {
        proxy_pass http://127.0.0.1:3100/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ==================== 对外 A2A 接口 ====================
    # 2026-08-12 起取消：Coordinator 不再对外暴露 A2A（仅对内 /internal）。
    # 对外 A2A 由独立 Agent「宣传大使」(ambassador, 端口 3200) 承接：
    # location /ambassador/a2a/ {
    #     proxy_pass http://127.0.0.1:3200/a2a/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # 速率限制区域定义 (需在 http 块中定义):
    # limit_req_zone $binary_remote_addr zone=a2a_limit:10m rate=30r/m;
}

# ==================== 安全 — 禁止直接访问 Coordinator 内部端口 ====================
# 本机防火墙规则 (iptables):
# 只允许 127.0.0.1 访问 3100 端口
# iptables -A INPUT -p tcp --dport 3100 -s 127.0.0.1 -j ACCEPT
# iptables -A INPUT -p tcp --dport 3100 -j DROP
